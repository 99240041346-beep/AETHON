name: AETHON API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aethon
          POSTGRES_PASSWORD: aethon
          POSTGRES_DB: aethon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aethon -d aethon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AETHON_DATABASE_URL: postgresql://aethon:aethon@127.0.0.1:5432/aethon
      AETHON_WORKER_ID: ci-worker
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full API and distributed persistence tests
        run: python -m pytest -q
      - name: Enforce migration contract from empty database
        run: python -m pytest -q tests/test_migrations.py
      - name: Enforce distributed persistence contract
        run: python -m pytest -q tests/test_postgres_distributed_integration.py
